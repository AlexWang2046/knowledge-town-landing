name: Build Knowledge Town PPTX

on:
  push:
    paths:
      - 'docs/BUILD_PPTX'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PPT dependencies
        run: python -m pip install --quiet python-pptx Pillow requests
      - name: Generate latest 15-slide deck
        run: python scripts/build_opc_deck.py
      - name: Commit PPTX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/KnowledgeTown_OPC_BP_15slides_latest.pptx
          git commit -m "Add latest Knowledge Town OPC pitch deck" || exit 0
          git push
